name: Release

on:
  push:
    tags:
      - 'fork/v*'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build and verify npm packages
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - name: Check release identity and tag
        id: metadata
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/native-sdk/package.json', 'utf8'));
          assert.equal(pkg.name, '@zogien/native-sdk');
          assert.equal(pkg.repository.url, 'git+https://github.com/' + process.env.GITHUB_REPOSITORY + '.git');
          const tag = 'fork/v' + pkg.version;
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, tag);
          const channel = pkg.publishConfig.tag;
          assert.equal(channel, 'latest');
          appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + pkg.version + '\ntag=' + tag + '\nchannel=' + channel + '\n');
          JS
      - run: npm --prefix packages/native-sdk run version:check
      - run: npm --prefix packages/native-sdk run scripts:check
      - name: Build all platform binaries
        run: bash packages/native-sdk/scripts/build-binaries.sh
      - name: Verify installed packages and default app build
        run: npm --prefix packages/native-sdk run package:check
      - name: Pack platform packages and main package
        run: |
          mkdir -p zig-out/packages
          destination="$PWD/zig-out/packages"
          for dir in packages/native-sdk/npm/*/; do
            (cd "$dir" && npm pack --pack-destination "$destination")
          done
          (cd packages/native-sdk && npm pack --pack-destination "$destination")
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: zig-out/packages/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: zig-out/release/*
          if-no-files-found: error

  publish:
    name: Publish fork release
    needs: build
    if: startsWith(github.ref, 'refs/tags/fork/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: release-packages
      - uses: actions/download-artifact@v4
        with:
          name: native-binaries
          path: release-binaries
      # Publishing uses each package's GitHub Actions trusted publisher (OIDC)
      # through the job's id-token permission. There is no npm token, so a
      # package without a trusted publisher fails here instead of falling back.
      - name: Publish platform packages, then main package
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          publish_package() {
            name="$1"
            archive_name="${name#@}"
            archive_name="${archive_name//\//-}-$VERSION.tgz"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published, skipping"
            else
              npm publish "./release-packages/$archive_name" --provenance --access public --tag "$CHANNEL"
            fi
          }
          for directory in packages/native-sdk/npm/*/; do
            name=$(node -p "require('./${directory}package.json').name")
            publish_package "$name"
          done
          publish_package "@zogien/native-sdk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release-binaries/* release-packages/*.tgz --clobber
